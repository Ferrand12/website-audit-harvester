[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "website-audit-harvester"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
